<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台中建案 3D 展示平台</title>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

    :root {
      --gold: #C9A96E;
      --gold-light: #E8D5A3;
      --dark: #0D0D0D;
      --dark-mid: #1A1A1A;
      --dark-surface: #242424;
      --text: #F0EBE1;
      --text-muted: #8A8070;
      --panel-bg: rgba(13, 13, 13, 0.88);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: 'Noto Serif TC', serif;
      overflow: hidden;
    }

    #cesiumContainer {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
    }

    /* ── 頂部標題列 ── */
    #header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: linear-gradient(180deg, rgba(13,13,13,0.95) 0%, transparent 100%);
      display: flex;
      align-items: center;
      padding: 0 32px;
      z-index: 100;
      pointer-events: none;
    }

    #header .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; letter-spacing: 0.15em; color: var(--gold-light); }
    #header .logo span { color: var(--gold); font-style: italic; }
    #header .divider { width: 1px; height: 24px; background: var(--gold); opacity: 0.4; margin: 0 20px; }
    #header .subtitle { font-size: 11px; letter-spacing: 0.3em; color: var(--text-muted); text-transform: uppercase; }

    /* ── 左側建案列表 ── */
    #sidebar { position: absolute; top: 80px; left: 24px; width: 240px; z-index: 100; }
    #sidebar .section-label { font-size: 9px; letter-spacing: 0.4em; color: var(--gold); text-transform: uppercase; margin-bottom: 12px; padding-left: 2px; }
    .project-card { background: var(--panel-bg); border: 1px solid rgba(201, 169, 110, 0.15); border-left: 2px solid transparent; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(12px); }
    .project-card:hover, .project-card.active { border-left-color: var(--gold); background: rgba(201, 169, 110, 0.08); }
    .project-card .name { font-size: 14px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 4px; }
    .project-card .tag { display: inline-block; font-size: 9px; letter-spacing: 0.2em; color: var(--gold); border: 1px solid rgba(201,169,110,0.3); padding: 2px 6px; margin-top: 6px; text-transform: uppercase; }

    /* ── 右側資訊面板 ── */
    #info-panel { position: absolute; top: 80px; right: 24px; width: 280px; background: var(--panel-bg); border: 1px solid rgba(201, 169, 110, 0.2); backdrop-filter: blur(16px); z-index: 100; opacity: 0; transform: translateX(20px); transition: all 0.4s ease; pointer-events: none; }
    #info-panel.visible { opacity: 1; transform: translateX(0); pointer-events: all; }
    #info-panel .panel-header { padding: 16px 20px; border-bottom: 1px solid rgba(201,169,110,0.15); }
    #info-panel .panel-title { font-size: 18px; color: var(--gold-light); letter-spacing: 0.08em; }
    #info-panel .panel-type { font-size: 10px; letter-spacing: 0.3em; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }
    #info-panel .fly-btn { display: block; width: calc(100% - 40px); margin: 16px 20px; padding: 10px; background: transparent; border: 1px solid var(--gold); color: var(--gold); font-family: 'Noto Serif TC', serif; font-size: 11px; letter-spacing: 0.3em; cursor: pointer; transition: all 0.3s ease; }
    #info-panel .fly-btn:hover { background: var(--gold); color: var(--dark); }

    /* ── ★ 編輯器面板 (隱藏) ── */
    #editor-panel {
      display: none; /* 預設隱藏 */
      position: absolute;
      top: 250px;
      right: 24px;
      width: 280px;
      background: rgba(20, 30, 40, 0.95);
      border: 1px solid #4A90E2;
      padding: 16px;
      z-index: 200;
      color: white;
      font-family: monospace;
    }
    #editor-panel h3 { margin-bottom: 12px; font-size: 14px; color: #4A90E2; border-bottom: 1px solid #4A90E2; padding-bottom: 5px;}
    .edit-row { margin-bottom: 10px; }
    .edit-row label { display: block; font-size: 10px; margin-bottom: 4px; color: #aaa;}
    .edit-row input[type="range"] { width: 100%; }
    .edit-row input[type="number"] { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 4px; font-size: 11px;}
    .val-display { float: right; color: #4A90E2; }
    #export-btn { width: 100%; padding: 8px; background: #4A90E2; color: white; border: none; cursor: pointer; margin-top: 10px; }
    #export-btn:hover { background: #357ABD; }

    #loading { position: absolute; inset: 0; background: var(--dark); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; transition: opacity 0.8s ease; }
    #loading .load-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--gold-light); }
    .cesium-viewer-toolbar, .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer, .cesium-viewer-bottom, .cesium-viewer-fullscreenContainer { display: none !important; }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>
<div id="loading"><div class="load-title">載入中...</div></div>
<div id="header"><div class="logo">台中 <span>建案展示</span></div></div>

<div id="sidebar">
  <div class="section-label">建案列表</div>
  <div id="project-list"></div> </div>

<div id="info-panel">
  <div class="panel-header">
    <div class="panel-title" id="panel-title">—</div>
    <div class="panel-type">建案資訊</div>
  </div>
  <button class="fly-btn" onclick="flyToSelected()">飛往建案位置</button>
</div>

<div id="editor-panel">
  <h3>📐 參數微調模式 (開發者)</h3>
  <div class="edit-row">
    <label>旋轉 (Heading) <span id="val-heading" class="val-display">0</span></label>
    <input type="range" id="edit-heading" min="0" max="360" step="1" value="0">
  </div>
  <div class="edit-row">
    <label>高程微調 (zOffset) <span id="val-z" class="val-display">0</span></label>
    <input type="range" id="edit-z" min="-20" max="50" step="0.5" value="0">
  </div>
  <div class="edit-row">
    <label>緯度 (Lat)</label>
    <input type="number" id="edit-lat" step="0.00005">
  </div>
  <div class="edit-row">
    <label>經度 (Lon)</label>
    <input type="number" id="edit-lon" step="0.00005">
  </div>
  <button id="export-btn" onclick="exportConfig()">匯出最新參數陣列</button>
</div>

<script>
  const MAPTILER_KEY = 'zhTSUMKAIWqRhSEw5UnD';
  Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJiMjAyZWZkYi0xYThjLTQwNjUtOGE1NC02MmRmYjFkM2Y2MjQiLCJpZCI6MzU4ODAwLCJpYXQiOjE3NjI3NTM4MTR9.fvdrFApwmT-uwtcPJT96iI5crPgoWLqJNHPnBRqvYvI';

// 核心建案資料
let projects = [
  {
    "name": "片片山閑",
    "lat": 24.16943917449622,
    "lon": 120.63775022480233,
    "file": "https://cute-strudel-08fbaf.netlify.app/%E7%89%87%E7%89%87%E5%B1%B1%E9%96%91_compressed.glb",
    "heading": 0,
    "zOffset": 0
  },
  {
    "name": "花果山",
    "lat": 24.175605644851554,
    "lon": 120.63628376577066,
    "file": "https://cute-strudel-08fbaf.netlify.app/%E8%8A%B1%E6%9E%9C%E5%B1%B1_compressed.glb",
    "heading": 0,
    "zOffset": 0
  },
  {
    "name": "山哼歌",
    "lat": 24.149539959921963,
    "lon": 120.65175920985773,
    "file": "https://cute-strudel-08fbaf.netlify.app/%E5%B1%B1%E5%93%BC%E6%AD%8C_compressed.glb",
    "heading": 0,
    "zOffset": 0
  },
  {
    "name": "惠國段",
    "lat": 24.15875,
    "lon": 120.64575,
    "file": "https://cute-strudel-08fbaf.netlify.app/%E6%83%A0%E5%9C%8B%E6%AE%B5_compressed.glb",
    "heading": 89,
    "zOffset": -14
  }
];

  let selectedIndex = -1;
  let viewer;
  const modelEntities = [];

  // ★ 權限限制：檢查網址是否有 ?mode=admin
  const urlParams = new URLSearchParams(window.location.search);
  const isAdmin = urlParams.get('mode') === 'admin';
  if (isAdmin) {
    document.getElementById('editor-panel').style.display = 'block';
  }

  // 初始化 Cesium
  viewer = new Cesium.Viewer('cesiumContainer', {
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    baseLayerPicker: false, navigationHelpButton: false, sceneModePicker: false, geocoder: false, homeButton: false, infoBox: false, selectionIndicator: false, timeline: false, animation: false
  });
  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0D0D0D');
  viewer.scene.skyAtmosphere.show = true;

  async function loadNeighborBuildings() {
    try {
      const tileset = await Cesium.Cesium3DTileset.fromUrl('https://3dtiles.nlsc.gov.tw/building/tiles3d/1/tileset.json');
      viewer.scene.primitives.add(tileset);
      tileset.style = new Cesium.Cesium3DTileStyle({ color: "color('rgba(180, 170, 155, 0.7)')" });
    } catch (e) { console.warn('鄰房載入失敗：', e); }
  }

  function loadProjectModels() {
    projects.forEach((p, i) => {
      const position = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.zOffset);
      const entity = viewer.entities.add({
        name: p.name,
        position: position,
        orientation: Cesium.Transforms.headingPitchRollQuaternion(position, new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(p.heading), 0, 0)),
        model: {
          uri: p.file, scale: 0.01, minimumPixelSize: 64, shadows: Cesium.ShadowMode.ENABLED, heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND
        }
      });
      modelEntities.push(entity);
    });
  }

  function renderSidebar() {
    const list = document.getElementById('project-list');
    list.innerHTML = projects.map((p, i) => `
      <div class="project-card" id="card-${i}" onclick="selectProject(${i})">
        <div class="name">${p.name}</div>
        <div class="tag">住宅</div>
      </div>
    `).join('');
  }

  function selectProject(index) {
    selectedIndex = index;
    const p = projects[index];

    document.querySelectorAll('.project-card').forEach((c, i) => c.classList.toggle('active', i === index));
    document.getElementById('panel-title').textContent = p.name;
    document.getElementById('info-panel').classList.add('visible');
    flyToSelected();

    // 如果在編輯模式，連動更新編輯器數值
    if (isAdmin) {
      document.getElementById('edit-heading').value = p.heading;
      document.getElementById('val-heading').textContent = p.heading;
      document.getElementById('edit-z').value = p.zOffset;
      document.getElementById('val-z').textContent = p.zOffset;
      document.getElementById('edit-lat').value = p.lat;
      document.getElementById('edit-lon').value = p.lon;
    }
  }

  function flyToSelected() {
    if (selectedIndex < 0) return;
    const p = projects[selectedIndex];
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 400),
      orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-30), roll: 0 },
      duration: 1.5
    });
  }

  // ★ 編輯器即時更新邏輯
  function attachEditorEvents() {
    const updateModel = () => {
      if (selectedIndex < 0) return;
      const p = projects[selectedIndex];
      const entity = modelEntities[selectedIndex];
      
      // 更新資料陣列
      p.heading = parseFloat(document.getElementById('edit-heading').value);
      p.zOffset = parseFloat(document.getElementById('edit-z').value);
      p.lat = parseFloat(document.getElementById('edit-lat').value);
      p.lon = parseFloat(document.getElementById('edit-lon').value);

      // 更新畫面顯示文字
      document.getElementById('val-heading').textContent = p.heading;
      document.getElementById('val-z').textContent = p.zOffset;

      // 即時重新計算 Cesium 實體的空間矩陣
      const position = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.zOffset);
      entity.position = position;
      entity.orientation = Cesium.Transforms.headingPitchRollQuaternion(
        position, 
        new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(p.heading), 0, 0)
      );
    };

    document.getElementById('edit-heading').addEventListener('input', updateModel);
    document.getElementById('edit-z').addEventListener('input', updateModel);
    document.getElementById('edit-lat').addEventListener('change', updateModel);
    document.getElementById('edit-lon').addEventListener('change', updateModel);
  }

  // ★ 匯出設定
  function exportConfig() {
    // 將調整好的 projects 陣列轉成字串
    const jsonStr = JSON.stringify(projects, null, 2);
    console.log("複製下方的陣列覆蓋原程式碼：");
    console.log(jsonStr);
    alert("已將最新參數印出至瀏覽器 Console，請按 F12 打開開發者工具複製。");
  }

  async function init() {
    viewer.terrainProvider = await Cesium.CesiumTerrainProvider.fromUrl(
      'https://api.maptiler.com/tiles/terrain-quantized-mesh-v2/?key=' + MAPTILER_KEY, { requestVertexNormals: true }
    );
    await loadNeighborBuildings();
    renderSidebar();
    loadProjectModels();
    if(isAdmin) attachEditorEvents();

    viewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(120.645, 24.163, 8000), orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 }, duration: 0 });
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1000);
  }

  init();
</script>
</body>
</html>
