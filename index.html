<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台中建案 3D 展示平台</title>

  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

    :root {
      --gold: #C9A96E;
      --gold-light: #E8D5A3;
      --dark: #0D0D0D;
      --dark-mid: #1A1A1A;
      --dark-surface: #242424;
      --text: #F0EBE1;
      --text-muted: #8A8070;
      --panel-bg: rgba(13, 13, 13, 0.88);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: 'Noto Serif TC', serif;
      overflow: hidden;
    }

    #cesiumContainer {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
    }

    /* ── 頂部標題列 ── */
    #header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: linear-gradient(180deg, rgba(13,13,13,0.95) 0%, transparent 100%);
      display: flex;
      align-items: center;
      padding: 0 32px;
      z-index: 100;
      pointer-events: none;
    }

    #header .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--gold-light);
    }

    #header .logo span {
      color: var(--gold);
      font-style: italic;
    }

    #header .divider {
      width: 1px;
      height: 24px;
      background: var(--gold);
      opacity: 0.4;
      margin: 0 20px;
    }

    #header .subtitle {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── 左側建案列表 ── */
    #sidebar {
      position: absolute;
      top: 80px;
      left: 24px;
      width: 240px;
      z-index: 100;
    }

    #sidebar .section-label {
      font-size: 9px;
      letter-spacing: 0.4em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-left: 2px;
    }

    .project-card {
      background: var(--panel-bg);
      border: 1px solid rgba(201, 169, 110, 0.15);
      border-left: 2px solid transparent;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
    }

    .project-card:hover,
    .project-card.active {
      border-left-color: var(--gold);
      background: rgba(201, 169, 110, 0.08);
    }

    .project-card .name {
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .project-card .coords {
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
      letter-spacing: 0.05em;
    }

    .project-card .tag {
      display: inline-block;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--gold);
      border: 1px solid rgba(201,169,110,0.3);
      padding: 2px 6px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* ── 右側資訊面板 ── */
    #info-panel {
      position: absolute;
      top: 80px;
      right: 24px;
      width: 280px;
      background: var(--panel-bg);
      border: 1px solid rgba(201, 169, 110, 0.2);
      backdrop-filter: blur(16px);
      z-index: 100;
      opacity: 0;
      transform: translateX(20px);
      transition: all 0.4s ease;
      pointer-events: none;
    }

    #info-panel.visible {
      opacity: 1;
      transform: translateX(0);
      pointer-events: all;
    }

    #info-panel .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(201,169,110,0.15);
    }

    #info-panel .panel-title {
      font-size: 18px;
      color: var(--gold-light);
      letter-spacing: 0.08em;
    }

    #info-panel .panel-type {
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    #info-panel .panel-body {
      padding: 16px 20px;
    }

    #info-panel .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    #info-panel .info-label {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    #info-panel .info-value {
      font-size: 12px;
      color: var(--text);
    }

    #info-panel .fly-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 16px 20px;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Noto Serif TC', serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    #info-panel .fly-btn:hover {
      background: var(--gold);
      color: var(--dark);
    }

    /* ── 底部提示 ── */
    #hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      z-index: 100;
      pointer-events: none;
    }

    /* ── 載入畫面 ── */
    #loading {
      position: absolute;
      inset: 0;
      background: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.8s ease;
    }

    #loading .load-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 300;
      color: var(--gold-light);
      letter-spacing: 0.2em;
      margin-bottom: 8px;
    }

    #loading .load-sub {
      font-size: 10px;
      letter-spacing: 0.5em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    #loading .load-bar {
      width: 200px;
      height: 1px;
      background: rgba(201,169,110,0.2);
      position: relative;
      overflow: hidden;
    }

    #loading .load-bar::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: var(--gold);
      animation: loadBar 2s ease-in-out infinite;
    }

    @keyframes loadBar {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* 隱藏 Cesium 預設 UI */
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-bottom,
    .cesium-viewer-fullscreenContainer {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<!-- 載入畫面 -->
<div id="loading">
  <div class="load-title">台中建案</div>
  <div class="load-sub">3D Interactive Viewer</div>
  <div class="load-bar"></div>
</div>

<!-- 頂部標題 -->
<div id="header">
  <div class="logo">台中 <span>建案展示</span></div>
  <div class="divider"></div>
  <div class="subtitle">Taichung 3D Property Viewer</div>
</div>

<!-- 左側建案列表 -->
<div id="sidebar">
  <div class="section-label">建案列表</div>

  <div class="project-card" data-index="0" onclick="selectProject(0)">
    <div class="name">片片山閑</div>
    <div class="coords">24.1694° N, 120.6378° E</div>
    <div class="tag">住宅</div>
  </div>

  <div class="project-card" data-index="1" onclick="selectProject(1)">
    <div class="name">花果山</div>
    <div class="coords">24.1756° N, 120.6363° E</div>
    <div class="tag">住宅</div>
  </div>

  <div class="project-card" data-index="2" onclick="selectProject(2)">
    <div class="name">山哼歌</div>
    <div class="coords">24.1495° N, 120.6518° E</div>
    <div class="tag">住宅</div>
  </div>

  <div class="project-card" data-index="3" onclick="selectProject(3)">
    <div class="name">惠國段</div>
    <div class="coords">24.1588° N, 120.6458° E</div>
    <div class="tag">住宅</div>
  </div>
</div>

<!-- 右側資訊面板 -->
<div id="info-panel">
  <div class="panel-header">
    <div class="panel-title" id="panel-title">—</div>
    <div class="panel-type">建案資訊</div>
  </div>
  <div class="panel-body">
    <div class="info-row">
      <span class="info-label">緯度</span>
      <span class="info-value" id="panel-lat">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">經度</span>
      <span class="info-value" id="panel-lon">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">狀態</span>
      <span class="info-value">預售中</span>
    </div>
  </div>
  <button class="fly-btn" onclick="flyToSelected()">飛往建案位置</button>
</div>

<!-- 底部提示 -->
<div id="hint">滑鼠左鍵旋轉 · 右鍵平移 · 滾輪縮放</div>

<script>
  // MapTiler API Key
  const MAPTILER_KEY = 'zhTSUMKAIWqRhSEw5UnD';

  // 停用 Cesium Ion（改用 MapTiler 地形）
  Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJiMjAyZWZkYi0xYThjLTQwNjUtOGE1NC02MmRmYjFkM2Y2MjQiLCJpZCI6MzU4ODAwLCJpYXQiOjE3NjI3NTM4MTR9.fvdrFApwmT-uwtcPJT96iI5crPgoWLqJNHPnBRqvYvI';

  // 建案資料
  const projects = [
    {
      name: '片片山閑',
      lat: 24.16943917449622,
      lon: 120.63775022480233,
      file: 'https://cute-strudel-08fbaf.netlify.app/%E7%89%87%E7%89%87%E5%B1%B1%E9%96%91_compressed.glb',
      height: 0
    },
    {
      name: '花果山',
      lat: 24.175605644851554,
      lon: 120.63628376577066,
      file: 'https://cute-strudel-08fbaf.netlify.app/%E8%8A%B1%E6%9E%9C%E5%B1%B1_compressed.glb',
      height: 0
    },
    {
      name: '山哼歌',
      lat: 24.149539959921963,
      lon: 120.65175920985773,
      file: 'https://cute-strudel-08fbaf.netlify.app/%E5%B1%B1%E5%93%BC%E6%AD%8C_compressed.glb',
      height: 0
    },
    {
      name: '惠國段',
      lat: 24.15876418739627,
      lon: 120.64576708513333,
      file: 'https://cute-strudel-08fbaf.netlify.app/%E6%83%A0%E5%9C%8B%E6%AE%B5_compressed.glb',
      height: 7
    }
  ];

  let selectedIndex = -1;
  let viewer;
  const modelEntities = [];

  // 初始化 Cesium
  viewer = new Cesium.Viewer('cesiumContainer', {
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    baseLayerPicker: false,
    navigationHelpButton: false,
    sceneModePicker: false,
    geocoder: false,
    homeButton: false,
    infoBox: false,
    selectionIndicator: false,
    timeline: false,
    animation: false,
    creditContainer: document.createElement('div')
  });

  // 設定深色背景
  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0D0D0D');
  viewer.scene.skyBox.show = false;
  viewer.scene.sun.show = false;
  viewer.scene.moon.show = false;
  viewer.scene.skyAtmosphere.show = true;

  // 載入國土測繪 3D Tiles 鄰房
  async function loadNeighborBuildings() {
    try {
      const tileset = await Cesium.Cesium3DTileset.fromUrl(
        'https://3dtiles.nlsc.gov.tw/building/tiles3d/1/tileset.json'
      );
      viewer.scene.primitives.add(tileset);

      // 鄰房樣式：深灰半透明
      tileset.style = new Cesium.Cesium3DTileStyle({
        color: "color('rgba(180, 170, 155, 0.7)')"
      });


    } catch (e) {
      console.warn('鄰房載入失敗：', e);
    }
  }

  // 載入建案 GLB 模型
  function loadProjectModels() {
    projects.forEach((p, i) => {
      const entity = viewer.entities.add({
        name: p.name,
        position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.height),
        orientation: Cesium.Transforms.headingPitchRollQuaternion(
          Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.height),
          new Cesium.HeadingPitchRoll(0, 0, Cesium.Math.toRadians(-90))
        ),
        model: {
          uri: p.file,
          scale: 0.01,           // ★ 公分 → 公尺（÷100）
          minimumPixelSize: 64,
          maximumScale: 200000,
          shadows: Cesium.ShadowMode.ENABLED,
          colorBlendMode: Cesium.ColorBlendMode.MIX,
          color: Cesium.Color.WHITE,
          colorBlendAmount: 0.0
        }
      });
      modelEntities.push(entity);
    });
  }

  // 選擇建案
  function selectProject(index) {
    selectedIndex = index;
    const p = projects[index];

    // 更新 sidebar 樣式
    document.querySelectorAll('.project-card').forEach((c, i) => {
      c.classList.toggle('active', i === index);
    });

    // 更新資訊面板
    document.getElementById('panel-title').textContent = p.name;
    document.getElementById('panel-lat').textContent = p.lat.toFixed(6) + '°';
    document.getElementById('panel-lon').textContent = p.lon.toFixed(6) + '°';
    document.getElementById('info-panel').classList.add('visible');

    // 飛往位置
    flyToSelected();
  }

  // 飛往選定建案
  function flyToSelected() {
    if (selectedIndex < 0) return;
    const p = projects[selectedIndex];
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 500),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-35),
        roll: 0
      },
      duration: 2.0
    });
  }

  // 初始化
  async function init() {
    // MapTiler 地形（台灣本土資料，無流量上限問題）
    viewer.terrainProvider = await Cesium.CesiumTerrainProvider.fromUrl(
      'https://api.maptiler.com/tiles/terrain-quantized-mesh-v2/?key=' + MAPTILER_KEY,
      { requestVertexNormals: true }
    );

    await loadNeighborBuildings();
    loadProjectModels();

    // 預設視角：台中市整體
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(120.645, 24.163, 8000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-45),
        roll: 0
      },
      duration: 0
    });

    // 隱藏載入畫面
    setTimeout(() => {
      const loading = document.getElementById('loading');
      loading.style.opacity = '0';
      setTimeout(() => loading.style.display = 'none', 800);
    }, 1500);
  }

  init();
</script>
</body>
</html>
